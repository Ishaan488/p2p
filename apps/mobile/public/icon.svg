<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="nodeLight" x1="112" y1="112" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="196" y1="196" x2="316" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="110" stroke="#27272A" stroke-width="4" />

  <!-- Subtle Geometric Grid Ring -->
  <circle cx="256" cy="256" r="168" stroke="#1F1F24" stroke-width="2" />

  <!-- Back / Top-Left Node (Desktop Node) -->
  <rect
    x="116"
    y="116"
    width="176"
    height="176"
    rx="44"
    stroke="url(#nodeLight)"
    stroke-width="26"
    stroke-Linecap="round"
    stroke-Linejoin="round"
  />

  <!-- Front / Bottom-Right Interlocking Node (Mobile Node) -->
  <rect
    x="220"
    y="220"
    width="176"
    height="176"
    rx="44"
    fill="#0E0E11"
    fill-opacity="0.72"
    stroke="url(#nodeLight)"
    stroke-width="26"
    stroke-Linecap="round"
    stroke-Linejoin="round"
  />

  <!-- Interlock Bridge Overpass (Creates true topological weave) -->
  <path
    d="M248 116H248C272.301 116 292 135.699 292 160V248"
    stroke="#FFFFFF"
    stroke-width="26"
    stroke-Linecap="round"
  />

  <!-- Precision Emerald Core Link Pulse -->
  <circle cx="204" cy="204" r="18" fill="url(#emeraldAccent)" />
  <circle cx="308" cy="308" r="18" fill="url(#emeraldAccent)" />
  <path
    d="M204 204L308 308"
    stroke="url(#emeraldAccent)"
    stroke-width="12"
    stroke-Linecap="round"
  />
</svg>
